name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

env:
  TERRAFORM_VERSION: '1.7.0'

jobs:
  terraform-drift:
    name: Detect Infrastructure Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=shopmicro.tfstate"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -detailed-exitcode -out=tfplan
          echo "exitcode=$?" >> $GITHUB_OUTPUT

      - name: Check for Drift
        if: steps.plan.outputs.exitcode == 2
        run: |
          echo "::warning::Terraform drift detected! Run terraform apply to reconcile."
          terraform show tfplan > drift-plan.txt
          cat drift-plan.txt
          
      - name: Post drift report
        if: steps.plan.outputs.exitcode == 2
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Terraform drift detected. See workflow logs for details.')
