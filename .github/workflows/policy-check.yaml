name: Policy as Code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  OPA:
    name: OPA Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/

      - name: Run Conftest
        run: |
          conftest test k8s/ --policy policy/ --namespace main || true
        continue-on-error: true

      - name: Kubernetes Validation
        run: |
          # Check for required fields in deployments
          for f in k8s/*/deployment.yaml; do
            echo "Validating $f"
            # Check resource limits exist
            grep -q "resources:" "$f" || echo "WARNING: $f missing resource limits"
            # Check security context exists
            grep -q "securityContext:" "$f" || echo "WARNING: $f missing securityContext"
          done
