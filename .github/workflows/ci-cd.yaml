name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_NAME: ${{ secrets.KUBERNETES_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend

      - name: Check JavaScript syntax
        run: node --check server.js
        working-directory: ./backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile ml-service/app.py

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./backend

      - name: Run backend tests
        run: |
          npm test || echo "No tests configured"
        working-directory: ./backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r ml-service/requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest --collect-only 2>/dev/null || echo "No tests configured"

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.AZURE_CR_USERNAME }}
          password: ${{ secrets.AZURE_CR_PASSWORD }}

      - name: Build and push backend
        run: |
          docker build -t $REGISTRY/shopmicro-backend:$IMAGE_TAG ./backend
          docker push $REGISTRY/shopmicro-backend:$IMAGE_TAG

      - name: Build and push frontend
        run: |
          docker build -t $REGISTRY/shopmicro-frontend:$IMAGE_TAG ./frontend
          docker push $REGISTRY/shopmicro-frontend:$IMAGE_TAG

      - name: Build and push ml-service
        run: |
          docker build -t $REGISTRY/shopmicro-ml:$IMAGE_TAG ./ml-service
          docker push $REGISTRY/shopmicro-ml:$IMAGE_TAG

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_SP_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_NAME }} \
            --overwrite-existing

      - name: Update image tags in k8s manifests
        run: |
          cd k8s
          
          # Update backend image
          sed -i "s|$REGISTRY/shopmicro-backend:.*|$REGISTRY/shopmicro-backend:$IMAGE_TAG|" backend/deployment.yaml
          
          # Update frontend image
          sed -i "s|$REGISTRY/shopmicro-frontend:.*|$REGISTRY/shopmicro-frontend:$IMAGE_TAG|" frontend/deployment.yaml
          
          # Update ml-service image
          sed -i "s|$REGISTRY/shopmicro-ml:.*|$REGISTRY/shopmicro-ml:$IMAGE_TAG|" ml-service/deployment.yaml

      - name: Commit and push image tag updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml k8s/ml-service/deployment.yaml
          git diff --staged --quiet || git commit -m "Update image tags to $IMAGE_TAG"
          git push

      - name: Deploy to Kubernetes
        run: |
          # Install NGINX Ingress Controller if not present
          kubectl get ns ingress-nginx &>/dev/null || kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml
          
          # Apply namespace and all resources (recursively)
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/ml-service/
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/redis/
          
          # Create secret if not exists
          kubectl create secret generic backend-secrets -n shopmicro \
            --from-literal=DB_PASSWORD=postgres \
            --from-literal=DB_USER=postgres \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Wait for postgres to be ready
          kubectl wait --for=condition=ready pod/postgres-0 -n shopmicro --timeout=120s || true
          
          # Initialize database if needed
          kubectl exec postgres-0 -n shopmicro -- psql -U postgres -d shopmicro -c "CREATE TABLE IF NOT EXISTS products (id SERIAL PRIMARY KEY, name TEXT NOT NULL, price NUMERIC(10,2) NOT NULL);" 2>/dev/null || true
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend -n shopmicro --timeout=120s
          kubectl rollout status deployment/frontend -n shopmicro --timeout=120s
          kubectl rollout status deployment/ml-service -n shopmicro --timeout=120s
          
      - name: Check pod health
        run: |
          kubectl get pods -n shopmicro
          kubectl get svc -n shopmicro
