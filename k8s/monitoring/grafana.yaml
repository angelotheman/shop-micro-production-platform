apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: shopmicro
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: shopmicro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SERVER_ROOT_URL
          value: https://angelotheman.myddns.me/monitor
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "true"
        envFrom:
        - secretRef:
            name: grafana-credentials
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
