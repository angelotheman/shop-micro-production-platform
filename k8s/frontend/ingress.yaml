apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopmicro-ingress
  namespace: shopmicro
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - angelotheman.myddns.me
    secretName: shopmicro-tls
  rules:
  - host: angelotheman.myddns.me
    http:
      paths:
      - path: /monitor
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /ml
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /assets
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
